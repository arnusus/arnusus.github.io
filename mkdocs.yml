site_name: نصوص يهودية بالعربية
site_description: ترجمات عربية للنصوص الدينية اليهودية الكلاسيكية عن أصولها العبرية والآرامية، مع هوامش شارحة

theme:
  name: material
  language: ar
  direction: rtl
  custom_dir: overrides
  font: false
  icon:
    logo: material/book-open-page-variant-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: الوضع الليلي
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: الوضع النهاري
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - content.footnote.tooltips

plugins:
  - search

markdown_extensions:
  - footnotes
  - attr_list
  - admonition
  - md_in_html
  - toc:
      permalink: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/arabic-digits.js
  - javascripts/kashida.js

# ===== فهرس الموقع =====
# المستوى الأول: التصنيفات (دين، شخصيات، أحداث تاريخية)، ويظهر كلّ تصنيف لسانًا في أعلى الموقع على الحاسوب.
# وتحت «دين» أبواب المكتبة (التلمود البابلي، المِشنا، المدراش، التفاسير...).
# كل نص جديد يُضاف تحت بابه، والشكل:
#   - العنوان بالعربية: المجلد/الرقم.md
# واسم الملف رقمٌ من ستّ خانات يتسلسل في الموقع كلّه: 000001، 000002، 000003...
# (آخر رقم مستعمل: 000003)، ويبقى المجلد قبله كما هو.
# لا يُضاف باب جديد إلا ومعه صفحة واحدة على الأقل.
nav:
  - الرئيسية:
      - index.md
      - عن الترجمة: about.md
  - دين:
      - التلمود البابلي:
          - قسم الأضرار:
              - سنهدرين:
                  - كلمة إلى القارئ: talmud-bavli/nezikin/sanhedrin/000003.md
  - شخصيات:
      - زوهر أرغوف: people/000001.md
  - أحداث تاريخية:
      - مجزرة معاليه عكرابيم: history/000002.md

extra:
  generator: false
