site_name: ترجمات عن العبرية
site_description: ترجمات عربية عن العبرية والآرامية لنصوص دينية يهودية وسِيَر شخصيات ومقالات عن أحداث تاريخية، مع هوامش شارحة

theme:
  name: material
  language: ar
  direction: rtl
  custom_dir: overrides
  font: false
  icon:
    logo: material/book-open-page-variant-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: الوضع الليلي
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: الوضع النهاري
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - content.footnote.tooltips

plugins:
  - search

markdown_extensions:
  - footnotes
  - attr_list
  - admonition
  - md_in_html
  - toc:
      permalink: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/arabic-digits.js
  - javascripts/kashida.js

# ===== فهرس الموقع =====
# المستوى الأول: التصنيفات، ويظهر كلّ تصنيف لسانًا في أعلى الموقع على الحاسوب:
#   دين (dat/)، شخصيات (people/)، أحداث تاريخية (history/).
# وتحت «دين» أبوابه (التلمود البابلي...)، ولا يُضاف بابٌ إلا ومعه نصّ منشور.
# كل نص جديد يُضاف تحت بابه، والشكل:
#   - العنوان بالعربية: المجلد/الرقم.md
# واسم الملف رقمٌ من ستّ خانات يتسلسل داخل كل مجلد على حدة: 000001، 000002...
# ويبقى المجلد قبله كما هو.
# لا يُضاف باب جديد إلا ومعه صفحة واحدة على الأقل.
# لكل تصنيف (وللتلمود البابلي) صفحة index.md تعرض محتوياته، فإذا أُضيف نص جديد
# أُضيفت له بطاقة في صفحة بابه.
nav:
  - الرئيسية:
      - index.md
      - عن الترجمة: about.md
  - دين:
      - dat/index.md
      - التلمود البابلي:
          - dat/talmud-bavli/index.md
          - قسم الأضرار:
              - سنهدرين:
                  - كلمة إلى القارئ: dat/talmud-bavli/nezikin/sanhedrin/000001.md
  - شخصيات:
      - people/index.md
      - زوهر أرغوف: people/000001.md
  - أحداث تاريخية:
      - history/index.md
      - مجزرة معاليه عكرابيم: history/000001.md

extra:
  generator: false
